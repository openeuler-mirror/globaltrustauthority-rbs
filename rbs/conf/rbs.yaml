# RBS Configuration File
# Global Trust Authority (GTA) Resource Broker Service — runtime configuration
# Override path via -c/--config or env RBS_CONFIG

# REST server (required when rest feature is enabled)
rest:
  listen_addr: "127.0.0.1:6666"   # listen address
  workers: 4
  body_limit_bytes: 10485760   # 10 MiB; max request body size (413 if exceeded)
  listen_backlog: 128           # TCP accept queue size
  request_timeout_secs: 60      # max time to read request and send response; 0 = no limit
  shutdown_timeout_secs: 30    # graceful shutdown: wait for in-flight requests before exit
  # When enabled: true, cert_file and key_file must be non-empty and point to valid PEM files.
  https:
    enabled: true
    cert_file: ""
    key_file: ""
  # Per-IP rate limit (token bucket). Effective only when built with --features per-ip-rate-limit.
  rate_limit:
    enabled: false
    requests_per_sec: 60   # max requests per second per client IP
    burst: null            # bucket capacity; default = requests_per_sec when null or omitted
  # When RBS is behind a trusted proxy, list its peer IPs here. Client IP for rate limit and audit
  # is then taken from Forwarded / X-Forwarded-For; otherwise the direct peer is used (no spoofing).
  trusted_proxy:
    addrs: []   # e.g. ["127.0.0.1", "::1"] for a local reverse proxy

# Bearer auth (JWT). Default admin: name and public key (PEM); JWT verified by this key. Role is always admin.
# New admins: registered via Admin API (POST /rbs/v0/users); their public_key/jwks_uri stored in user data.

# Authentication configuration
auth:
  # AttestToken verification (public key from config file)
  attest_token:
    # public_key_path: "/etc/rbs/attest_pub.pem"
    jwks_file: "/etc/rbs/attest.jwk"
    issuer: "Global Trust Authority"

  # BearerToken verification (per-user keys from DB via UserKeyProvider)
  bearer_token:
    issuer: "rbs-cli"
    audience: "globaltrustauthority-rbs"

# Admin / user management configuration
admin:
  max_users: 10
  admin_key:
    public_key_path: "/etc/rbs/admin_pub.pem"   # PEM format (or jwks_file for JWK format)

# Policy module configuration
policy:
  max_per_user: 10   # max policies per user; create rejected when count reaches this limit (1..=100)

# Logging (default: file + rotation for RPM install; set file_path to empty or remove to use stderr only)
logging:
  level: info                    # trace | debug | info | warn | error | off
  format: text                   # text | json
  file_path: /var/log/rbs/rbs.log
  enable_rotation: true
  rotation:
    max_file_size_bytes: 10485760   # bytes before roll
    max_files: 6
    compression: gzip              # none | gzip
    file_mode: 440                 # rotated file permission. Unix only
  file_mode: 640

# Attestation service (GTA and other backends). Timeout per backend under rest.*.
attestation:
  default_as_provider: gta
  backends:
    gta:
      mode: rest
      rest:
        base_url: "https://127.0.0.1:8080"
        timeout_secs: 30
        retries: 3
        tls_verify: true
        ca_file: ""   # custom CA bundle path; empty = use system default
        credentials:
          user_id: "rbs-service"   # required
          api_key_auth: false   # set true and fill keys below to enable API-Key auth
          main_api_key: ""   # format: m. + 32 alphanumeric (34 chars); required when api_key_auth: true
          sub_api_key: ""    # format: s. + 32 alphanumeric (34 chars); required when api_key_auth: true

storage:
  db_type: sqlite
  # #  max_connections secs
  max_connections: 10
  # #  timeout secs
  timeout: 30
  # # url: "mysql://user:pass@host:3306/rbs"
  url: "sqlite:///root/rbs.db"
  sql_file_path: "rbs/rdb_sql/sqlite_rbs.sql"

# Resource backends (for multiple backends). Reserved provider names: admin, attestation,
# resource, health — do not use them as backend keys. Validated at startup: backends must be
# non-empty and each entry must pass ResourceProviderConfig::validate (see field constraints).
resource:
  max_per_user: 10   # max resources per user; create rejected when count reaches this limit (1..=100)
  backends:
    vault:
      type: vault                 # whitelist ["vault","ca","hsm"]; other values fail-fast at startup
      url: "https://127.0.0.1:8200"  # must start with http:// or https://, length ≤ 2048
      token: "${VAULT_TOKEN}"     # Vault access token; Sensitive (redacted in logs, zeroized on drop)
      mount_path: "secret"        # secrets engine mount path; non-empty, length ≤ 128
      kv_version: "v2"            # whitelist ["v1", "v2"]; v2 uses /data/ and /metadata/ paths
      verify_ssl: true            # TLS verification; production must be true
      timeout: 30                 # request timeout in seconds; range [1, 3600]
      max_connections: 100        # connection count; range [1, 10000]
      max_retries: 2              # retry count on failure; ≤ 100
      max_response_body_bytes: 1048576   # max backend response body size in bytes; bounds memory when reading resource content; range [1024, 10485760], default 1 MiB
      allowed_resource_types: ["secret", "cert"]  # resource type whitelist for this backend

    # HSM (PKCS#11) backend — stores key material as opaque blobs in an HSM token.
    hsm:
      type: hsm                                          # backend type; must be in ["vault","ca","hsm"]
      module_path: "/usr/lib/softhsm/libsofthsm2.so"    # PKCS#11 .so path; loaded via C_Initialize at startup
      slot:
        label: "rbs_slot"                                # slot label; matched via C_GetSlotList
      credentials:
        pin_env: "RBS_HSM_PIN"                           # PIN read from env var, not inlined in config
      allowed_resource_types: ["key", "secret"]          # resource type whitelist for this backend
      max_key_bytes: 65536                               # max content size in bytes
      timeout: 30                                         # session pool wait and single PKCS#11 call timeout (seconds)

    # CA (CMPv2) backend — issues X.509 certificates via CMP protocol.
    ca:
      type: ca                                                # backend type; must be in ["vault","ca","hsm"]
      url: "https://ca:8443/cmp"                              # CMP endpoint URL; HTTP POST
      https:
        verify: true                                          # TLS verification; production must be true
        ca_file: "/etc/rbs/ca-server.pem"                     # custom CA bundle; empty = use system default
      message_protection_cert_file: "/etc/rbs/cmp-client.crt" # CMP PKI Protection signing certificate
      message_protection_key_file: "/etc/rbs/cmp-client.key"  # CMP PKI Protection signing private key
      response_protection_trust_anchors_file: "/etc/rbs/ca-anchors.pem"  # CMP response verification trust anchors
      cert_profile: "smime"                               # cert profile name in PKIHeader generalInfo (id-it-certProfile); empty = omit, CA must default
      allowed_resource_types: ["cert"]                  # resource type whitelist for this backend
      max_response_bytes: 1048576                             # max CMP response size; default 1 MiB
      timeout: 30                                             # HTTP POST timeout in seconds
      idempotency:
        max_entries: 1000                                     # idempotency LRU cache capacity
        ttl_seconds: 300                                      # idempotency TTL in seconds

