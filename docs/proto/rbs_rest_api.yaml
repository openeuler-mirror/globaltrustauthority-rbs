openapi: 3.1.0
info:
  title: RBS REST API
  description: Resource Broker Service (RBS) HTTP API.
  contact:
    name: RBS open-source community
    url: https://gitcode.com/openeuler/globaltrustauthority-rbs
  license:
    name: Mulan Permissive Software License, Version 2
    url: http://license.coscl.org.cn/MulanPSL2
  version: '0'
servers:
- url: http://localhost:6666
  description: Default local development (see `rbs.yaml` `rest.listen_addr`)
paths:
  /rbs/v0/attest:
    post:
      tags:
      - Attestation
      summary: Submit attestation evidence and obtain token
      operationId: postAttest
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestRequest'
        required: true
      responses:
        '200':
          description: Attestation token (JSON).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: Attestation backend returned a non-2xx; RBS forwards GTA's status code and wraps GTA's body in the error field.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Attestation provider unreachable or timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - {}
  /rbs/v0/attestation/cert:
    get:
      tags:
      - Attestation
      summary: List certificates (default provider)
      operationId: listCertsDefault
      parameters:
      - name: ids
        in: query
        description: Comma-separated certificate IDs
        required: false
        schema:
          type: string
      - name: cert_type
        in: query
        description: Filter by certificate type
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size (1-10, default 10)
        required: false
        schema:
          type: integer
          format: int64
      - name: offset
        in: query
        description: Offset (0-100000, default 0)
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: Certificate list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: GTA unreachable or timeout; other GTA statuses forwarded as-is
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
    put:
      tags:
      - Attestation
      summary: Update a certificate (default provider)
      operationId: updateCertDefault
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertUpdateRequest'
        required: true
      responses:
