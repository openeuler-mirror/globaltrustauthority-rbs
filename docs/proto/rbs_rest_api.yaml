components:
  schemas:
    AttestRequest:
      type: object
      description: Request body for POST /rbs/v0/attest.
      properties:
        as_provider:
          type:
          - string
          - 'null'
          description: Optional attestation backend id (e.g. gta); default is deployment-specific.
        rbc_evidences:
          $ref: '#/components/schemas/RbcEvidencesPayload'
          description: Evidence bundle from RBC.
    AttestResponse:
      type: object
      description: Response for POST /rbs/v0/attest.
      required:
      - token
      properties:
        token:
          type: string
          description: AttestToken or session JWT for subsequent Bearer resource access.
    AttestationDeleteType:
      type: string
      description: |-
        Delete mode for ref_value/cert DELETE operations: `"id"`, `"all"`, or `"type"`.

        GTA accepts `"id"`, `"all"`, `"type"` for ref_value and cert.
      enum:
      - id
      - all
      - type
    AttestationPolicy:
      type: object
      description: |-
        Attestation policy entity returned by GTA; fields beyond `id`/`name`/`attester_type` appear only in by_ids.

        Named `AttestationPolicy` to distinguish from RBS local resource policy
        (`Policy`/`PolicyResponse` in `t_res_policy`). `id`/`name`/`attester_type`
        are always present in both GTA by_type/all (summary) and by_ids (full)
        responses, so they are mandatory. Other fields appear only in by_ids.
      required:
      - id
      - name
      - attester_type
      properties:
        id:
          type: string
          description: Stable policy identifier.
          example: P1
        name:
          type: string
          description: Policy name.
          example: policy1
        description:
          type:
          - string
          - 'null'
          description: Optional description (by_ids path only).
        content:
          type:
          - string
          - 'null'
          description: Policy content (JWT or text) (by_ids path only).
        attester_type:
          type: array
          items:
            type: string
          description: Attester type list (array, unlike ref_value's scalar attester_type).
          example: '["tpm","sgx"]'
        is_default:
          type:
          - boolean
          - 'null'
          description: Whether this is the default policy (by_ids path only).
        version:
          type:
          - integer
          - 'null'
          format: int32
          description: Policy version (by_ids path only).
          example: 1
        update_time:
          type:
          - integer
          - 'null'
          format: int64
          description: Last update timestamp as Unix epoch seconds or milliseconds, depending on the GTA response.
          example: 1700000000000
        valid_code:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Validity code: 0 = valid, 1 = invalid (by_ids path only).'
          example: 0
    AttestationPolicyListResponse:
      type: object
      description: Paginated response for GET attestation policy list.
      required:
      - policies
      properties:
        policies:
          type: array
          items:
            $ref: '#/components/schemas/AttestationPolicy'
          description: List of policies matching the query.
        total_count:
          type:
          - integer
          - 'null'
          format: int64
          description: Total matching count.
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: Effective page size returned by GTA.
        offset:
          type:
          - integer
          - 'null'
          format: int64
          description: Effective page offset returned by GTA.
    AttesterData:
      type: object
      description: |-
        Optional attester-supplied metadata, carried per measurement.

        Stored under `rbc_evidences.measurements[].attester_data`.
        `runtime_data` must not duplicate the challenge nonce (nonce lives only
        under `rbc_evidences.measurements[].nonce`).
      properties:
        runtime_data:
          type:
          - object
          - 'null'
          description: |-
            Key/value runtime fields; excludes nonce.

            Example: `attester_pubkey` as JWK for encrypted resource return.
          additionalProperties: {}
          propertyNames:
            type: string
    AuthChallengeResponse:
      type: object
      description: Response for GET /rbs/v0/challenge (attestation challenge).
      required:
      - nonce
      properties:
        nonce:
          type: string
          description: |-
            Challenge value for binding attestation (opaque; often Base64).
            Use the field value as-is in `rbc_evidences.measurements[].nonce`
            for POST /rbs/v0/attest and POST .../retrieve.
    AuthType:
      type: string
      description: Authentication method for the user; currently only `jwt` is supported.
      enum:
      - jwt
    BuildMetadata:
      type: object
      description: Build-time identity for the running binary.
      required:
      - version
      - git_hash
      - build_date
      properties:
        version:
          type: string
          description: Cargo package / release version (semver).
          example: 0.1.0
        git_hash:
          type: string
          description: Git commit hash at build time (hex), or empty when not embedded at build.
          example: ''
        build_date:
          type: string
          description: Build timestamp (UTC), typically RFC 3339, or empty when not embedded at build.
          example: ''
    CertCreateRequest:
      type: object
      description: Request body for POST cert (create).
      required:
      - name
      - type
      properties:
        name:
          type: string
          description: Certificate name (1-255 chars, GTA-enforced).
          example: cert1
          minLength: 1
        type:
          type: array
          items:
            type: string
          description: Certificate type list (JSON field name `type`); 1-7 items, each one of `refvalue`, `policy`, `tpm_boot`, `tpm`, `tpm_ima`, `crl`, `ascend_npu`; `crl` must be the only entry.
          example: '["tpm"]'
        description:
          type:
          - string
          - 'null'
          description: Optional description (at most 512 chars).
        content:
          type:
          - string
          - 'null'
          description: Certificate content; required when `cert_type` does not contain `crl`.
        crl_content:
          type:
          - string
          - 'null'
          description: CRL content; required when `cert_type` contains `crl` (which must then be the only entry).
        is_default:
          type:
          - boolean
          - 'null'
          description: Whether to set as default certificate.
    CertDeleteRequest:
      type: object
      description: |-
        Request body for DELETE cert (batch delete).

        GTA accepts `delete_type` = `"id"`/`"all"`/`"type"`, with
        `cert_type` (JSON field name `type`) as the type filter.
      required:
      - delete_type
      properties:
        delete_type:
          $ref: '#/components/schemas/AttestationDeleteType'
          description: Delete mode.
        ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: IDs to delete (required when `delete_type` is `Id`; at most 10 IDs).
        type:
          type:
          - string
          - 'null'
          description: Cert type filter (required when `delete_type` is `Type`; JSON field name `type`); one of `refvalue`, `policy`, `tpm_boot`, `tpm`, `tpm_ima`, `crl`, `ascend_npu`.
          example: refvalue
    CertListResponse:
      type: object
      description: Paginated response for GET cert list.
      properties:
        certs:
          type: array
          items:
            $ref: '#/components/schemas/CertRecord'
          description: List of certificates matching the query.
        crls:
          type: array
          items:
            $ref: '#/components/schemas/CrlRecord'
          description: List of CRL records matching the query.
        total_count:
          type:
          - integer
          - 'null'
          format: int64
          description: Total matching count.
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: Effective page size returned by GTA.
        offset:
          type:
          - integer
          - 'null'
          format: int64
          description: Effective page offset returned by GTA.
    CertMutationResponse:
      type: object
      description: |-
        Response for POST/PUT cert (create/update mutation).

        GTA wraps the result in a `cert` or `crl` key; only one is present.
        RBS is a stateless proxy and passes the wrapper through unchanged.
      properties:
        cert:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CertMutationResult'
            description: Present when a cert was created/updated.
        crl:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CrlMutationResult'
            description: Present when a CRL was created/updated.
    CertMutationResult:
      type: object
      description: |-
        Inner mutation result for cert create/update.

        GTA returns `{"cert": {"cert_id":"...", "cert_name":"...", "version": 1}}`.
      properties:
        cert_id:
          type:
          - string
          - 'null'
          description: Certificate ID.
          example: C1
        cert_name:
          type:
          - string
          - 'null'
          description: Certificate name.
          example: cert1
        version:
          type:
          - integer
          - 'null'
          format: int32
          description: New version after mutation.
          example: 2
    CertRecord:
      type: object
      description: |-
        Certificate record returned by GTA.

        All fields are optional: GTA's `CertRespInfo` serializes every field
        with `skip_serializing_if = "Option::is_none"`, so the present subset
        depends on the query path and the underlying database row.
      properties:
        cert_id:
          type:
          - string
          - 'null'
          description: Stable certificate identifier.
          example: C1
        cert_name:
          type:
          - string
          - 'null'
          description: Certificate name.
          example: cert1
        description:
          type:
          - string
          - 'null'
          description: Optional description.
        content:
          type:
          - string
          - 'null'
          description: Certificate content (PEM etc.).
        cert_type:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Certificate type list.
        is_default:
          type:
          - boolean
          - 'null'
          description: Whether this is the default certificate.
        version:
          type:
          - integer
          - 'null'
          format: int32
          description: Certificate version.
          example: 1
        create_time:
          type:
          - integer
          - 'null'
          format: int64
          description: Creation timestamp as Unix epoch seconds or milliseconds, depending on the GTA response.
          example: 1700000000000
        update_time:
          type:
          - integer
          - 'null'
          format: int64
          description: Last update timestamp as Unix epoch seconds or milliseconds, depending on the GTA response.
          example: 1700000000000
        valid_code:
          type:
          - integer
          - 'null'
          format: int32
          description: Validity code.
          example: 0
        cert_revoked_date:
          type:
          - integer
          - 'null'
          format: int64
          description: Revocation date (Unix epoch seconds).
          example: 1700000000
        cert_revoked_reason:
          type:
          - string
          - 'null'
          description: Revocation reason.
    CertUpdateRequest:
      type: object
      description: |-
        Request body for PUT cert (update).

        `id` is required (collection-level operation, id in body not path).
        At least one of `name`/`description`/`cert_type`/`is_default` must be
        present (GTA rejects empty updates). GTA rejects `content` on update —
        the field is passed through so GTA can return the appropriate error.
      required:
      - id
      properties:
        id:
          type: string
          description: ID of the certificate to update (1-32 chars, GTA-enforced).
          example: C1
        name:
          type:
          - string
          - 'null'
          description: New name (1-255 chars).
        description:
          type:
          - string
          - 'null'
          description: New description (at most 512 chars).
        type:
          type:
          - array
          - 'null'
          items:
            type: string
          description: New certificate type list (JSON field name `type`); 1-7 items, each one of `refvalue`, `policy`, `tpm_boot`, `tpm`, `tpm_ima`, `ascend_npu` — `crl` cannot be set on update.
        content:
          type:
          - string
          - 'null'
          description: Certificate content — GTA rejects this on update.
        is_default:
          type:
          - boolean
          - 'null'
          description: Whether to set as default certificate.
    ChallengeRequest:
      type: object
      description: Query parameter for GET /rbs/v0/challenge (challenge request).
      properties:
        as_provider:
          type:
          - string
          - 'null'
          description: Optional attestation backend id (e.g. gta); default is deployment-specific.
    CreatePolicyRequest:
      type: object
      description: Policy create request body.
      required:
      - name
      - content_type
      - content
      properties:
        name:
          type: string
          description: Policy name, unique per user (1-255 chars; `<>\"'&|\\/*?` and backtick are forbidden).
          maxLength: 255
          minLength: 1
          pattern: ^[^<>"'&|\\/*?`]*$
        content_type:
          type: string
          description: Encoding of `content`; only `base64` is supported.
          pattern: ^base64$
        content:
          type: string
          description: Base64-encoded Rego policy text; must decode to valid UTF-8 within the configured size limit.
          minLength: 1
    CreateResourceRequest:
      type: object
      description: Request body for `POST /rbs/v0/{uri}` — create a resource.
      required:
      - policy_id
      properties:
        policy_id:
          type: string
          description: UUID of the caller-owned policy that governs reads of this resource.
          maxLength: 36
          minLength: 1
        content_type:
          type:
          - string
          - 'null'
          description: Content type label; one of `jwt`, `json`, `text`, `binary`, `jwk`, `jwe` (fixed whitelist).
        export_mode:
          type:
          - string
          - 'null'
          description: Export mode on read; only `jwe` is accepted (plaintext export is rejected); defaults to `jwe`.
        additional_info:
          type:
          - string
          - 'null'
          description: Free-form description of the resource; when present, 1-512 chars (empty string rejected).
        content:
          type:
          - string
          - 'null'
          description: Base64-encoded content, stored via the backend when it supports PUT. Optional for backends that generate the object themselves (e.g. CA) or require it to pre-exist.
    CrlMutationResult:
      type: object
      description: |-
        Inner mutation result for CRL create.

        GTA returns `{"crl": {"crl_id":"...", "crl_name":"..."}}`.
      properties:
        crl_id:
          type:
          - string
          - 'null'
          description: CRL ID.
          example: L1
        crl_name:
          type:
          - string
          - 'null'
          description: CRL name.
          example: crl1
    CrlRecord:
      type: object
      description: CRL (Certificate Revocation List) record returned by GTA.
      properties:
        crl_id:
          type:
          - string
          - 'null'
          description: Stable CRL identifier.
          example: L1
        crl_name:
          type:
          - string
          - 'null'
          description: CRL name.
          example: crl1
        crl_content:
          type:
          - string
          - 'null'
          description: CRL content.
    ErrorBody:
      type: object
      description: Error payload for HTTP error responses (e.g. 500).
      required:
      - error
      properties:
        error:
          type: string
          description: |-
            Error string for the caller.

            May be a stable code, a short machine-oriented label, or a concise
            human-readable message. Must not include stack traces or secrets.
    PolicyCreateRequest:
      type: object
      description: Request body for POST attestation policy (create).
      required:
      - name
      - attester_type
      - content_type
      - content
      properties:
        name:
          type: string
          description: Policy name (1-255 chars; GTA rejects the special characters `< > " ' & | \ / * ?` and backtick).
          example: policy1
          minLength: 1
        attester_type:
          type: array
          items:
            type: string
          description: 'Attester type list (1-9 items, each at most 255 chars); supported values: `all`, `tpm`, `tpm_boot`, `tpm_ima`, `virt_cca`, `ascend_npu`, `itrustee`, `cca`, `dice`.'
          example: '["tpm"]'
          minItems: 1
        content_type:
          type: string
          description: 'Content encoding (required): `jwt` or `text` (GTA-enforced).'
          example: jwt
          minLength: 1
        content:
          type: string
          description: Policy content (base64-encoded); the decoded size is bounded by GTA's `policy_content_size_limit` (shipped default 500 KB).
          example: eyJhbGciOiJSUzI1NiJ9...
          minLength: 1
        is_default:
          type:
          - boolean
          - 'null'
          description: Whether to set as default policy.
        description:
          type:
          - string
          - 'null'
          description: Optional description (at most 512 chars).
    PolicyDeleteRequest:
      type: object
      description: |-
        Request body for DELETE policy (batch delete).

        GTA accepts `delete_type` = `"id"`/`"all"`/`"attester_type"`, with
        `attester_type` as the type filter.
      required:
      - delete_type
      properties:
        delete_type:
          $ref: '#/components/schemas/PolicyDeleteType'
          description: Delete mode.
        ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: IDs to delete (required when `delete_type` is `Id`; at most 10 IDs, each at most 36 chars).
        attester_type:
          type:
          - string
          - 'null'
          description: Attester type filter (required when `delete_type` is `AttesterType`; at most 255 chars).
          example: tpm
    PolicyDeleteType:
      type: string
      description: |-
        Delete mode for policy DELETE operations.

        GTA accepts `"id"`, `"all"`, `"attester_type"` for policy.
      enum:
      - id
      - all
      - attester_type
    PolicyListResponse:
      type: object
      description: Policy list response.
      required:
      - items
      - total_count
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PolicyResponse'
          description: Current page of policies.
        total_count:
          type: integer
          format: int64
          description: Total matching policies (not only this page).
        limit:
          type: integer
          format: int64
          description: Effective page size (mirrors the request `limit`).
        offset:
          type: integer
          format: int64
          description: Effective page offset (mirrors the request `offset`).
    PolicyMutation:
      type: object
      description: Inner mutation result for policy create/update.
      required:
      - id
      - name
      - version
      properties:
        id:
          type: string
          description: ID of the mutated policy.
          example: P1
        name:
          type: string
          description: Name of the mutated policy.
          example: policy1
        version:
          type: integer
          format: int32
          description: New version after mutation.
          example: 2
    PolicyMutationResponse:
      type: object
      description: |-
        Response for POST/PUT policy (create/update).

        Mirrors GTA's `{"policy": {"id":"...", "name":"...", "version": 1}}`.
        RBS is a stateless proxy — deserialized and passed through unchanged.
      required:
      - policy
      properties:
        policy:
          $ref: '#/components/schemas/PolicyMutation'
          description: Mutation result.
    PolicyResponse:
      type: object
      description: Policy response returned to callers.
      required:
      - policy_id
      - policy_name
      - policy_version
      - content_type
      - created_at
      - updated_at
      properties:
        policy_id:
          type: string
          description: Policy ID (UUID v4), generated by RBS.
        policy_name:
          type: string
          description: Policy name, unique per user.
        policy_version:
          type: integer
          format: int32
          description: 'Monotonic version: starts at 1 and increments on every update (optimistic-lock token).'
        content_type:
          type: string
          description: Encoding of the stored policy content (always `base64`).
        created_at:
          type: string
          description: Creation time (RFC 3339).
        updated_at:
          type: string
          description: Last update time (RFC 3339).
        applied_resources:
          type:
          - array
          - 'null'
          items:
            type: string
          description: URIs of resources bound to this policy; only returned by single-policy GET (omitted elsewhere).
    PolicyUpdateRequest:
      type: object
      description: |-
        Request body for PUT attestation policy (update).

        `id` is required (collection-level operation, id in body not path).
      required:
      - id
      properties:
        id:
          type: string
          description: ID of the policy to update (1-36 chars, GTA-enforced).
          example: P1
        name:
          type:
          - string
          - 'null'
          description: New name (1-255 chars; GTA rejects the special characters `< > " ' & | \ / * ?` and backtick).
        description:
          type:
          - string
          - 'null'
          description: New description (at most 512 chars).
        attester_type:
          type:
          - array
          - 'null'
          items:
            type: string
          description: New attester type list (1-9 items, each at most 255 chars).
        content_type:
          type:
          - string
          - 'null'
          description: 'New content encoding: `jwt` or `text`.'
        content:
          type:
          - string
          - 'null'
          description: New policy content (base64-encoded; decoded size limited as on create).
        is_default:
          type:
          - boolean
          - 'null'
          description: Whether to set as default policy.
    RbcEvidenceItem:
      type: object
      description: Single attestation artifact within a measurement (backend-specific detail).
      properties:
        attester_type:
          type:
          - string
          - 'null'
          description: Plugin or attester kind (e.g. tpm_boot).
        evidence:
          description: Evidence payload (string or object per attestation backend).
        policy_ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: Policy identifiers evaluated for this evidence.
        ref_value_id:
          type:
          - string
          - 'null'
          description: |-
            Optional reference value ID for precise baseline matching.
            When present, GTA matches baseline by id+uid; when absent, by attester_type+uid.
    RbcEvidencesPayload:
      type: object
      description: |-
        Evidence JSON produced by RBC (`collect_evidence`) or equivalent.

        Typical GTA-oriented shape includes a non-empty `measurements` array;
        deployments may add other keys or per-backend wrappers.
      properties:
        agent_version:
          type:
          - string
          - 'null'
          description: Optional agent or collector version string.
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/RbcMeasurement'
          description: At least one entry required for standard attest flows; each entry carries nonce and evidences.
    RbcMeasurement:
      type: object
      description: One node or attestation unit inside the evidence bundle.
      required:
      - nonce
      properties:
        nonce:
          type: string
          description: Must equal the `nonce` field from GET /rbs/v0/challenge (same string, no transformation).
        node_id:
          type:
          - string
          - 'null'
          description: Optional node or workload identifier.
        nonce_type:
          type:
          - string
          - 'null'
          description: |-
            Nonce interpretation mode. Only `"verifier"` is supported: the nonce must
            be the verifier-generated challenge obtained from `GET /rbs/v0/challenge`.
            Attester-generated nonces are not supported by this flow.
        token_fmt:
          type:
          - string
          - 'null'
          description: Optional desired token format hint (backend-specific).
        attester_data:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AttesterData'
            description: Attester-supplied metadata for this measurement.
        evidences:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RbcEvidenceItem'
          description: Collected attestation artifacts for this measurement.
    RbsVersion:
      type: object
      description: JSON emitted by `GET /rbs/version` (`service_name`, `api_version`, structured `build`).
      required:
      - service_name
      - api_version
      - build
      properties:
        service_name:
          type: string
          description: Logical service display name.
          example: globaltrustauthority-rbs
        api_version:
          type: string
          description: Published API contract version string.
          example: '0'
        build:
          $ref: '#/components/schemas/BuildMetadata'
          description: Build metadata (`version`, `git_hash`, `build_date`) for this binary; same shape as in the exported `OpenAPI` schema.
    RefValue:
      type: object
      description: |-
        Reference value (baseline) entity returned by GTA.

        RBS acts as a stateless proxy. `id`/`name`/`attester_type` are always
        present in both GTA by_type/all (summary) and by_ids (full) responses,
        so they are mandatory. `uid`/`description`/`content`/`content_type`/
        `version`/`valid_code` appear only in the by_ids full response and are
        optional.
      required:
      - id
      - name
      - attester_type
      properties:
        id:
          type: string
          description: Stable ref_value identifier.
          example: rv-001
        uid:
          type:
          - string
          - 'null'
          description: User-scoped identifier (by_ids path only).
          example: test_01
        name:
          type: string
          description: Human-readable baseline name.
          example: tpm-baseline
        attester_type:
          type: string
          description: Attester type (e.g. tpm, tpm_ima, virt_cca).
          example: tpm
        description:
          type:
          - string
          - 'null'
          description: Optional description (by_ids path only).
          example: TPM reference baseline
        content:
          type:
          - string
          - 'null'
          description: Baseline content (JWT or base64-encoded payload) (by_ids path only).
          example: eyJhbGciOiJSUzI1NiJ9...
        content_type:
          type:
          - string
          - 'null'
          description: 'Content encoding: "jwt" (default) or "base64" (by_ids path only).'
          example: jwt
        version:
          type:
          - integer
          - 'null'
          format: int32
          description: Baseline version (by_ids path only).
          example: 1
        valid_code:
          type:
          - integer
          - 'null'
          format: int32
          description: 'Validity code: 0 = valid, 1 = invalid (by_ids path only).'
          example: 0
    RefValueCreateRequest:
      type: object
      description: Request body for POST ref_value (create).
      required:
      - name
      - attester_type
      - content
      properties:
        name:
          type: string
          description: Baseline name (1-255 chars, GTA-enforced).
          example: tpm-baseline
          minLength: 1
        attester_type:
          type: string
          description: Attester type; one of `tpm`, `tpm_ima`, `virt_cca`, `ascend_npu`, `cca` (GTA-enforced).
          example: tpm
          minLength: 1
        content:
          type: string
          description: Baseline content — JWT or base64-encoded payload; at most 100 MiB (GTA-enforced).
          example: eyJhbGciOiJSUzI1NiJ9...
          minLength: 1
        content_type:
          type:
          - string
          - 'null'
          description: 'Content encoding: `jwt` (default when omitted) or `base64`.'
          example: jwt
        description:
          type:
          - string
          - 'null'
          description: Optional description (at most 512 chars, GTA-enforced).
          example: TPM reference baseline
    RefValueDeleteRequest:
      type: object
      description: |-
        Request body for DELETE ref_value (batch delete).

        GTA accepts `delete_type` = `"id"`/`"all"`/`"type"`, with
        `attester_type` as the type filter.
      required:
      - delete_type
      properties:
        delete_type:
          $ref: '#/components/schemas/AttestationDeleteType'
          description: Delete mode.
        ids:
          type:
          - array
          - 'null'
          items:
            type: string
          description: IDs to delete (required when `delete_type` is `Id`; 1-10 IDs, each 1-36 chars).
        attester_type:
          type:
          - string
          - 'null'
          description: Attester type filter (required when `delete_type` is `Type`); one of `tpm`, `tpm_ima`, `virt_cca`, `ascend_npu`, `cca`.
          example: tpm
    RefValueListResponse:
      type: object
      description: |-
        Paginated response for GET ref_value list.

        `total_count`, `limit`, and `offset` are optional: present in by_type/all
        paths, absent in by_ids paths.
      required:
      - ref_values
      properties:
        ref_values:
          type: array
          items:
            $ref: '#/components/schemas/RefValue'
          description: List of ref_values matching the query.
        total_count:
          type:
          - integer
          - 'null'
          format: int64
          description: Total matching count (present in by_type/all paths; absent in by_ids path).
        limit:
          type:
          - integer
          - 'null'
          format: int64
          description: Effective page size returned by GTA.
        offset:
          type:
          - integer
          - 'null'
          format: int64
          description: Effective page offset returned by GTA.
    RefValueMutation:
      type: object
      description: Inner mutation result for ref_value create/update.
      required:
      - id
      - name
      - version
      properties:
        id:
          type: string
          description: ID of the mutated ref_value.
          example: rv-001
        name:
          type: string
          description: Name of the mutated ref_value.
          example: tpm-baseline
        version:
          type: integer
          format: int32
          description: New version after mutation.
          example: 2
    RefValueMutationResponse:
      type: object
      description: |-
        Response for POST/PUT ref_value (create/update).

        Mirrors GTA's `{"ref_value": {"id":"...", "name":"...", "version": 1}}`.
        RBS is a stateless proxy — deserialized and passed through unchanged.
      required:
      - ref_value
      properties:
        ref_value:
          $ref: '#/components/schemas/RefValueMutation'
          description: Mutation result.
    RefValueUpdateRequest:
      type: object
      description: |-
        Request body for PUT ref_value (update).

        `id` is required (collection-level operation, id in body not path).
        All other fields are optional; at least one should be provided.
      required:
      - id
      properties:
        id:
          type: string
          description: ID of the ref_value to update (1-36 chars, GTA-enforced).
          example: rv-001
        name:
          type:
          - string
          - 'null'
          description: New name (1-255 chars).
          example: updated-baseline
        description:
          type:
          - string
          - 'null'
          description: New description (at most 512 chars).
        attester_type:
          type:
          - string
          - 'null'
          description: New attester_type; one of `tpm`, `tpm_ima`, `virt_cca`, `ascend_npu`, `cca`.
          example: tpm
        content:
          type:
          - string
          - 'null'
          description: New content (at most 100 MiB).
          example: eyJhbGciOiJSUzI1NiJ9...
        content_type:
          type:
          - string
          - 'null'
          description: 'New content encoding: `jwt` or `base64`.'
          example: base64
    ResourceContentResponse:
      type: object
      description: |-
        Resource content returned by GET and POST .../retrieve.

        `content` is always base64-encoded JWE ciphertext (Compact Serialization).
      required:
      - uri
      - content
      - export_mode
      properties:
        uri:
          type: string
          description: Canonical resource URI for the returned object.
        content:
          type: string
          description: Base64-encoded JWE ciphertext.
        content_type:
          type:
          - string
          - 'null'
          description: Content type label (`jwt`, `json`, `text`, `binary`, `jwk`, `jwe`) for decoding the decrypted content.
        export_mode:
          type: string
          description: Export mode; always `jwe`.
    ResourceInfoResponse:
      type: object
      description: Resource metadata returned by GET .../info (no secret material).
      required:
      - uri
      - user_id
      - policy_id
      - created_at
      - updated_at
      - export_mode
      properties:
        uri:
          type: string
          description: Canonical resource URI.
        user_id:
          type: string
          description: Username of the resource owner.
        policy_id:
          type: string
          description: UUID of the policy bound to this resource.
        created_at:
          type: string
          description: Creation time (RFC 3339).
        updated_at:
          type: string
          description: Last update time (RFC 3339).
        content_type:
          type:
          - string
          - 'null'
          description: Content type label (`jwt`, `json`, `text`, `binary`, `jwk`, `jwe`), if set.
        export_mode:
          type: string
          description: Export mode of the resource; always `jwe`.
    ResourceListResponse:
      type: object
      description: |-
        Response body for `GET /rbs/v0/resource` — the caller's resources.

        Items carry the same metadata shape as single-resource reads; secret
        content is never included (content stays on the per-resource
        GET / `POST .../retrieve` paths behind JWE).
      required:
      - items
      - total_count
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ResourceResponse'
          description: Current page of the caller's resources (`created_at` descending).
        total_count:
          type: integer
          format: int64
          description: Total matching resources (not only this page).
        limit:
          type: integer
          format: int64
          description: Effective page size (mirrors the request `limit`).
        offset:
          type: integer
          format: int64
          description: Effective page offset (mirrors the request `offset`).
    ResourceResponse:
      type: object
      description: Resource metadata returned after create or update.
      required:
      - uri
      - provider_name
      - repository_name
      - resource_type
      - resource_name
      - created_at
      - updated_at
      - export_mode
      - policy_id
      properties:
        uri:
          type: string
          description: 'Canonical resource URI: `/rbs/v0/{res_provider}/{repository_name}/{resource_type}/{resource_name}`.'
        provider_name:
          type: string
          description: Backend provider name (first URI segment).
        repository_name:
          type: string
          description: Backend repository name (second URI segment).
        resource_type:
          type: string
          description: Resource type (third URI segment), e.g. `secret`, `cert`, `key`.
        resource_name:
          type: string
          description: Resource name (fourth URI segment).
        created_at:
          type: string
          description: Creation time (RFC 3339).
        updated_at:
          type: string
          description: Last update time (RFC 3339).
        content_type:
          type:
          - string
          - 'null'
          description: Content type label (`jwt`, `json`, `text`, `binary`, `jwk`, `jwe`), if set.
        export_mode:
          type: string
          description: Export mode of the resource; always `jwe`.
        policy_id:
          type: string
          description: UUID of the policy bound to this resource.
        additional_info:
          type:
          - string
          - 'null'
          description: Free-form description (1-512 chars), if set.
    Role:
      type: string
      description: User role. `Admin` is pre-configured and cannot be created via the API.
      enum:
      - admin
      - user
    UpdatePolicyRequest:
      type: object
      description: Policy update request body. All fields are required (full replacement).
      required:
      - name
      - content_type
      - content
      properties:
        name:
          type: string
          description: New policy name, unique per user (1-255 chars; `<>\"'&|\\/*?` and backtick are forbidden).
          maxLength: 255
          minLength: 1
          pattern: ^[^<>"'&|\\/*?`]*$
        content_type:
          type: string
          description: New encoding of `content`; only `base64` is supported.
          pattern: ^base64$
        content:
          type: string
          description: New base64-encoded Rego policy text; must decode to valid UTF-8 within the configured size limit.
          minLength: 1
    UpdateResourceRequest:
      type: object
      description: |-
        Request body for `PUT /rbs/v0/{uri}` — update or create a resource.

        `policy_id` is optional on update: an explicit value rebinds the resource to
        a new policy (validated as usual); omitting it keeps the existing resource's
        binding. A brand-new resource created via the upsert path still requires an
        explicit `policy_id`.
      properties:
        policy_id:
          type:
          - string
          - 'null'
          description: New policy binding (must be caller-owned); omitted keeps the current binding. Required when the upsert creates a new resource.
          maxLength: 36
          minLength: 1
        content_type:
          type:
          - string
          - 'null'
          description: New content type label (`jwt`, `json`, `text`, `binary`, `jwk`, `jwe`); omitted keeps the current value.
        export_mode:
          type:
          - string
          - 'null'
          description: New export mode; only `jwe` is accepted; omitted keeps the current value.
        additional_info:
          type:
          - string
          - 'null'
          description: New description (when present, 1-512 chars); omitted keeps the current value.
        content:
          type:
          - string
          - 'null'
          description: Base64-encoded replacement content; omitted leaves the backend content unchanged.
    UserCreateRequest:
      type: object
      description: Request body for POST /rbs/v0/users (create user).
      required:
      - username
      - auth_type
      properties:
        username:
          type: string
          description: Login or unique handle. Immutable.
          maxLength: 36
          minLength: 1
          pattern: ^[a-zA-Z0-9_-]+$
        role:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Role'
            description: Optional role; only `user` is allowed via API (admin is pre-configured).
        enabled:
          type:
          - boolean
          - 'null'
          description: Whether the account is enabled.
        auth_type:
          $ref: '#/components/schemas/AuthType'
          description: Authentication method; currently only `jwt` is supported.
        public_key:
          type:
          - string
          - 'null'
          description: Base64-encoded PEM public key (mutually exclusive with `jwk`).
        jwk:
          description: JWK public key JSON object (mutually exclusive with `public_key`).
    UserListResponse:
      type: object
      description: Paginated response for GET /rbs/v0/users.
      required:
      - users
      - total_count
      - limit
      - offset
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
          description: Page of users.
        total_count:
          type: integer
          format: int64
          description: Total matching users (not only this page).
        limit:
          type: integer
          format: int64
          description: Effective page size (may mirror request `limit`).
        offset:
          type: integer
          format: int64
          description: Effective skip count (may mirror request `offset`).
    UserResponse:
      type: object
      description: Response for user retrieval, creation, and update.
      required:
      - id
      - username
      - role
      - enabled
      - created_at
      - updated_at
      properties:
        id:
          type: string
          description: Stable user ID (UUID).
        username:
          type: string
          description: Human-facing login or handle.
        role:
          $ref: '#/components/schemas/Role'
          description: User role.
        enabled:
          type: boolean
          description: Whether the account is enabled.
        created_at:
          type: string
          description: Creation time (RFC 3339).
        updated_at:
          type: string
          description: Last modification time (RFC 3339).
    UserUpdateRequest:
      type: object
      description: |-
        Request body for PUT /rbs/v0/users/{username} (update user).

        All fields are optional, but at least one must be provided.
        `username` is NOT in the request body — it is immutable.
      properties:
        role:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/Role'
            description: |-
              New role; only the target's current role is accepted — any other value is rejected with 403.

              The `admin` role is pre-configured and not API-assignable: assigning it
              to a non-built-in target is rejected with `admin role is pre-configured
              and not API-assignable` (403); the built-in Administrator may only keep
              `role: "admin"` (a no-op, 200) — any other role is rejected with
              `cannot modify 'role' of the built-in administrator` (403). A non-admin
              self-update sending its current role (`user`) is a no-op (200); any
              other role is rejected with `self-update may not modify 'role'` (403).
        enabled:
          type:
          - boolean
          - 'null'
          description: |-
            Whether the account can authenticate.

            A non-admin self-update may set this to `true` (a no-op) but may
            **not** disable itself; `false` is rejected with `self-update may not
            modify 'enabled'` (403).
        auth_type:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AuthType'
            description: New authentication method; currently only `jwt` is supported.
        public_key:
          type:
          - string
          - 'null'
          description: Base64-encoded PEM public key (mutually exclusive with `jwk`).
        jwk:
          description: JWK public key JSON object (mutually exclusive with `public_key`).
  securitySchemes:
    attestAuth:
      type: http
      scheme: bearer
      bearerFormat: Attest
      description: 'Attest token. Send as `Authorization: Attest <token>`. Obtain via `POST /rbs/v0/attest`.'
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT Bearer token. Send as `Authorization: Bearer <token>`. Obtain via Admin API or attestation.'
tags:
- name: System
  description: '`RbsCore::system` — service identity and API/build version via `GET /rbs/version` (system metadata). Does not require authentication.'
- name: Admin
  description: User management CRUD — `GET/POST/PUT/DELETE /rbs/v0/users` (admin or self). Requires BearerToken.
- name: Policy
  description: Policy CRUD — `GET/POST/PUT/DELETE /rbs/v0/resource/policy`. Requires BearerToken.
- name: Resource
  description: Resource CRUD — `GET/POST/PUT/DELETE /rbs/v0/{provider}/{repo}/{type}/{name}`. Supports AttestToken and BearerToken.
- name: Attestation
  description: Attestation challenge/token issuance (`GET /rbs/v0/challenge`, `POST /rbs/v0/attest`, no auth) and attestation management CRUD for ref_value/cert/policy (`/rbs/v0/attestation/{as_provider}/{type}`, Bearer + admin only).
