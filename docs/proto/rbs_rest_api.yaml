openapi: 3.1.0
info:
  title: RBS REST API
  description: Resource Broker Service (RBS) HTTP API.
  contact:
    name: RBS open-source community
    url: https://gitcode.com/openeuler/globaltrustauthority-rbs
  license:
    name: Mulan Permissive Software License, Version 2
    url: http://license.coscl.org.cn/MulanPSL2
  version: '0'
servers:
- url: http://localhost:6666
  description: Default local development (see `rbs.yaml` `rest.listen_addr`)
paths:
  /rbs/v0/attest:
    post:
      tags:
      - Attestation
      summary: Submit attestation evidence and obtain token
      description: Submit the RBC evidence bundle to the attestation backend; on success an attest token is returned for resource reads (`GET .../{resource}` and `POST .../retrieve`). The token is replayable until it expires. `rbc_evidences.measurements[].nonce_type` supports only `verifier` (the verifier-generated challenge from `GET /rbs/v0/challenge`); attester-generated nonces are not supported. No authentication required.
      operationId: postAttest
      requestBody:
        description: Evidence bundle including the nonce obtained from `GET /rbs/v0/challenge` (`nonce_type` must be `verifier`); `attester_data.runtime_data.tee-pubkey` (JWK) is used to JWE-encrypt returned resources.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestRequest'
        required: true
      responses:
        '200':
          description: Attestation token (JSON).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttestResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Builtin attestation backend mode is configured but not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: 'Attestation backend error, forwarded verbatim: RBS returns GTA''s non-2xx status code (502 shown as an example; statuses such as 400 or 500 are returned as-is) and wraps GTA''s body in the error field.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: Attestation provider unreachable or timed out.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - {}
  /rbs/v0/attestation/cert:
    get:
      tags:
      - Attestation
      summary: List certificates (default provider)
      description: 'Uses the configured default attestation provider. List certificates and CRLs: `ids` returns up to 10 full records (pagination ignored); otherwise paged summaries filtered by `cert_type`. Admin Bearer only; RBS proxies to GTA (503 when unreachable, other GTA statuses forwarded as-is).'
      operationId: listCertsDefault
      parameters:
      - name: ids
        in: query
        description: Comma-separated certificate IDs (at most 100, GTA-enforced).
        required: false
        schema:
          type: string
      - name: cert_type
        in: query
        description: Filter by certificate type; one of `refvalue`, `policy`, `tpm_boot`, `tpm`, `tpm_ima`, `crl`, `ascend_npu` (query param `cert_type`, JSON field `type`).
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Page size (1-10, default 10).
        required: false
        schema:
          type: integer
          format: int64
          maximum: 10
          minimum: 1
      - name: offset
        in: query
        description: Page offset (0-100000, default 0).
        required: false
        schema:
          type: integer
          format: int64
          maximum: 100000
          minimum: 0
      responses:
        '200':
          description: Certificate list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertListResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: GTA unreachable or timeout; other GTA statuses forwarded as-is
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
    put:
      tags:
      - Attestation
      summary: Update a certificate (default provider)
      description: Uses the configured default attestation provider. Update a certificate/CRL record identified by in-body `id`; other fields are optional pass-through. GTA rejects `content` changes on update. Admin Bearer only; RBS proxies to GTA (503 when unreachable, other GTA statuses forwarded as-is).
      operationId: updateCertDefault
      requestBody:
        description: ID of the certificate to update plus optional new field values; `content` changes are rejected by GTA.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertUpdateRequest'
        required: true
      responses:
        '200':
          description: Certificate updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertMutationResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: GTA unreachable or timeout; other GTA statuses forwarded as-is
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
    post:
      tags:
      - Attestation
      summary: Create a certificate (default provider)
      description: Uses the configured default attestation provider. Create a certificate or CRL record (`crl_content` required when `type` contains `crl`, otherwise `content`). Admin Bearer only; RBS proxies to GTA (503 when unreachable, other GTA statuses forwarded as-is).
      operationId: createCertDefault
      requestBody:
        description: 'Certificate or CRL record: when `type` contains `crl`, `crl_content` is required; otherwise `content` is required.'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertCreateRequest'
        required: true
      responses:
        '201':
          description: Certificate created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertMutationResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Provider not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: GTA unreachable or timeout; other GTA statuses forwarded as-is
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
    delete:
      tags:
      - Attestation
      summary: Batch delete certificates (default provider)
      description: 'Uses the configured default attestation provider. Delete certificates/CRLs by mode: `id` (ID list), `all`, or `type` (cert type filter). Admin Bearer only; RBS proxies to GTA (503 when unreachable, other GTA statuses forwarded as-is).'
      operationId: deleteCertsDefault
      requestBody:
        description: Delete mode (`id` / `all` / `type`) with the matching `ids` or cert type filter.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CertDeleteRequest'
        required: true
      responses:
        '204':
          description: Certificates deleted
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '404':
          description: Not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '503':
          description: GTA unreachable or timeout; other GTA statuses forwarded as-is
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
      security:
      - bearerAuth: []
