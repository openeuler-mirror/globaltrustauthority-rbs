      security:
      - bearerAuth: []
      - attestAuth: []
    put:
      tags:
      - Resource
      summary: Update or create resource
      description: Upsert a resource owned by the caller. Omitted optional fields keep their current values; an explicit `policy_id` rebinds the resource (must be caller-owned) while omitting it keeps the current binding — a new resource created via this path requires `policy_id`. Returns 201 when created, 200 when updated, and 409 on a concurrent update (optimistic locking).
