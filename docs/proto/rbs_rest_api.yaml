    post:
      tags:
      - Resource
      summary: Retrieve resource with attestation evidence
      description: |-
        The client submits RBC evidences in the request body.

        The service calls the configured attestation backend to verify the evidence
        and obtain an attest token, then uses the token claims (including
        `tee-pubkey`) for Rego policy evaluation and JWE encryption of the resource
        content.
      operationId: retrieveResource
      parameters:
      - name: res_provider
        in: path
        description: Backend provider name; must be configured under `resource.backends` in `rbs.yaml` (e.g. `vault`, `ca`, `hsm`); reserved names (`admin`, `attestation`, `resource`, `health`) are rejected
        required: true
        schema:
          type: string
      - name: repository_name
        in: path
        description: Repository name (1-32 chars; only letters, digits, `_` and `-`)
        required: true
        schema:
          type: string
          maxLength: 32
          minLength: 1
          pattern: ^[A-Za-z0-9_-]+$
