      - name: resource_name
        in: path
        description: Resource name (1-32 chars; only letters, digits, `_`, `-` and `.`)
        required: true
        schema:
          type: string
          maxLength: 32
          minLength: 1
          pattern: ^[A-Za-z0-9_.-]+$
      requestBody:
        description: Evidence bundle (same shape as `POST /rbs/v0/attest`) including the nonce from `GET /rbs/v0/challenge`; the token's `tee-pubkey` claim is used to JWE-encrypt the returned content.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttestRequest'
        required: true
      responses:
        '200':
          description: Resource content (base64-encoded JWE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceContentResponse'
        '404':
          description: Resource not found or access denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '501':
          description: Builtin attestation backend mode is configured but not implemented.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '502':
          description: 'Attestation backend error, forwarded verbatim: RBS returns GTA''s non-2xx status code (502 shown as an example; statuses such as 400 or 500 are returned as-is) and wraps GTA''s body in the error field.'
